[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-scrn-fix"
version = "0.1.0"
description = "Set the capture date of World of Warcraft screenshots from their filenames."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["piexif==1.1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wow-scrn-fix = "wow_scrn_fix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
